name: EventHub responsive browser smoke tests

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/loadtest/browser-layout-smoke.mjs"
      - ".github/workflows/eventhub-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Responsive layout on Chromium and WebKit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: cloudflare
        run: npm install --no-save playwright
      - name: Install Chromium and WebKit
        working-directory: cloudflare
        run: npx playwright install --with-deps chromium webkit
      - name: Test phone, tablet and desktop layouts
        env:
          EVENTHUB_TARGET_URL: https://eventhub-vk.ksmu.workers.dev
        run: node cloudflare/loadtest/browser-layout-smoke.mjs
