<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hostel Cultural Events</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px;
           background: var(--vkui--color_background_content, #fff);
           color: var(--vkui--color_text_primary, #000); }
    h2 { margin-top: 0; }
    .card { border-radius: 12px; padding: 14px; margin-bottom: 12px;
            background: var(--vkui--color_background_secondary, #f5f5f5); }
    .seats { color: #888; font-size: 14px; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 12px;
             font-size: 16px; font-weight: 600;
             background: #2688eb; color: #fff; margin-top: 8px; }
    button:disabled { background: #b8c1cc; }
  </style>
</head>
<body>
  <h2>🎭 Hostel Cultural Events</h2>
  <p id="greeting">Loading…</p>
  <div id="list"></div>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script>
    const events = [
      { id: 101, name: "Movie Night",    date: "Fri 8 PM", seats: 12 },
      { id: 102, name: "Open Mic",       date: "Sat 7 PM", seats: 5  },
      { id: 103, name: "Dance Workshop", date: "Sun 5 PM", seats: 20 },
    ];

    // 1. Always first: initialize the bridge
    bridge.send('VKWebAppInit');

    // 2. Get the user (works in VK; fails silently in a plain browser)
    let userName = "friend";
    bridge.send('VKWebAppGetUserInfo')
      .then(u => {
        userName = u.first_name;
        document.getElementById('greeting').textContent =
          `Hi, ${userName}! Pick an event:`;
      })
      .catch(() => {
        document.getElementById('greeting').textContent = 'Pick an event:';
      });

    function render() {
      document.getElementById('list').innerHTML = events.map(e => `
        <div class="card">
          <b>${e.name}</b> — ${e.date}<br>
          <span class="seats">${e.seats} seats left</span>
          <button onclick="register(${e.id})"
            ${e.seats === 0 ? 'disabled' : ''}>
            ${e.seats === 0 ? 'Sold out' : 'Register'}
          </button>
        </div>`).join('');
    }

    function register(id) {
      const e = events.find(ev => ev.id === id);
      if (e.seats > 0) {
        e.seats--;
        render();
        alert(`✅ You're registered for ${e.name}, ${userName}! See you there.`);
      }
    }

    render();
  </script>
</body>
</html>
