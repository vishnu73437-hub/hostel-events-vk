<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Hostel Cultural Events</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--vkui--color_background_content, #fff);
      color: var(--vkui--color_text_primary, #000);
    }
    h2 { margin-top: 0; }
    .card {
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--vkui--color_background_secondary, #f5f5f5);
    }
    .seats { color: #888; font-size: 14px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      background: #2688eb;
      color: #fff;
      margin-top: 8px;
    }
    button:disabled { background: #b8c1cc; }
  </style>
</head>
<body>
  <h2>🎭 Hostel Cultural Events</h2>
  <p id="greeting">Loading events…</p>
  <div id="list"></div>

  <script>
    const events = [
      { id: 101, name: "Movie Night", date: "Fri 8 PM", seats: 12 },
      { id: 102, name: "Open Mic", date: "Sat 7 PM", seats: 5 },
      { id: 103, name: "Dance Workshop", date: "Sun 5 PM", seats: 20 },
    ];

    const greetingEl = document.getElementById('greeting');
    const listEl = document.getElementById('list');
    let userName = "friend";

    function render() {
      listEl.innerHTML = events.map(e => `
        <div class="card">
          <b>${e.name}</b> — ${e.date}<br>
          <span class="seats">${e.seats} seats left</span>
          <button onclick="register(${e.id})" ${e.seats === 0 ? 'disabled' : ''}>
            ${e.seats === 0 ? 'Sold out' : 'Register'}
          </button>
        </div>`).join('');
    }

    function register(id) {
      const e = events.find(ev => ev.id === id);
      if (e && e.seats > 0) {
        e.seats--;
        render();
        alert(`✅ You're registered for ${e.name}, ${userName}! See you there.`);
      }
    }

    function showEvents() {
      greetingEl.textContent = `Hi, ${userName}! Pick an event:`;
      render();
    }

    // Render immediately; a slow or blocked bridge CDN must not block the app.
    showEvents();

    function initializeVK() {
      const bridge = window.vkBridge;
      if (!bridge || typeof bridge.send !== 'function') {
        console.warn('VK Bridge unavailable; running in browser mode.');
        return;
      }

      bridge.send('VKWebAppInit')
        .then(() => bridge.send('VKWebAppGetUserInfo'))
        .then(user => {
          userName = user.first_name || "friend";
          showEvents();
        })
        .catch(error => {
          console.warn('VK Bridge initialization/user info failed:', error);
          showEvents();
        });
    }

    // The browser bundle exposes window.vkBridge, not a global named bridge.
    // Load asynchronously so a network issue cannot prevent page rendering.
    const bridgeScript = document.createElement('script');
    bridgeScript.src = 'https://unpkg.com/@vkontakte/vk-bridge@2.14.2/dist/browser.min.js';
    bridgeScript.async = true;
    bridgeScript.onload = initializeVK;
    bridgeScript.onerror = () => {
      console.warn('Could not load VK Bridge; the events page remains available.');
    };
    document.head.appendChild(bridgeScript);
  </script>
</body>
</html>
